<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title description">
  <title id="title">One Beam Search stage</title>
  <desc id="description">Model forward produces logits. Each parent contributes up to K candidates. Global selection retains the winning children and their parent indices. Sequence state and KV history inherit those parents. The chosen tokens enter the next model forward. The final stage returns results without a next-step forward.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 6 L 1 11 Z" fill="#2563a6"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="638" height="958" rx="24" fill="#f7faff" stroke="#d7e3f1" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="320" y="49" font-size="30" font-weight="700" fill="#153a60">One stage: keep parent identity</text>
    <rect x="40" y="80" width="560" height="110" rx="18" fill="#e8f0fb" stroke="#2563a6" stroke-width="2"/>
    <text x="320" y="122" font-size="30" font-weight="700" fill="#153a60">1. Model forward</text>
    <text x="320" y="162" font-size="26" fill="#263f58">Current prefixes + their KV -&gt; logits</text>
    <path d="M 320 190 V 222" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="236" width="560" height="110" rx="18" fill="#e8f0fb" stroke="#2563a6" stroke-width="2"/>
    <text x="320" y="278" font-size="30" font-weight="700" fill="#153a60">2. Candidate selection</text>
    <text x="320" y="318" font-size="26" fill="#263f58">Up to K valid tokens from each parent</text>
    <path d="M 320 346 V 378" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="392" width="560" height="110" rx="18" fill="#fff1df" stroke="#d47716" stroke-width="2"/>
    <text x="320" y="434" font-size="30" font-weight="700" fill="#6b3907">3. Global selection</text>
    <text x="320" y="474" font-size="26" fill="#624726">Tokens + scores + parent indices</text>
    <path d="M 320 502 V 534" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="548" width="560" height="110" rx="18" fill="#e8f0fb" stroke="#2563a6" stroke-width="2"/>
    <text x="320" y="590" font-size="30" font-weight="700" fill="#153a60">4. Inherit sequence and KV</text>
    <text x="320" y="630" font-size="26" fill="#263f58">Example parent map: [0, 0, 2]</text>
    <path d="M 320 658 V 690" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="704" width="560" height="110" rx="18" fill="#e8f0fb" stroke="#2563a6" stroke-width="2"/>
    <text x="320" y="746" font-size="30" font-weight="700" fill="#153a60">5. Next input</text>
    <text x="320" y="786" font-size="26" fill="#263f58">Child tokens + inherited histories</text>
    <text x="320" y="874" font-size="25" font-weight="700" fill="#153a60">Repeat for the next component.</text>
    <text x="320" y="916" font-size="23" fill="#485b70">Final stage: return; no next-step forward.</text>
  </g>
</svg>
